<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bounty Donor Point for challengers</title>
  <script type="module" crossorigin src="/bounty-donor-point/assets/index-CDIgkVCW.js"></script>
  <link rel="stylesheet" crossorigin href="/bounty-donor-point/assets/index-C1fPcEkp.css">
</head>
<body>

  <header class="header-container">
    <div>
      <h1 class="title">Bounty Donor Point for challengers</h1>
      <div class="filters-bar">
        <span class="filter-tag">fair map ↳</span>
        <span class="filter-tag">tourist map ↳</span>
        <span class="filter-tag highlight">campus map ↳</span>
        <span class="filter-tag">event map ↳</span>
        <span style="margin-left: 1rem; color: #94a3b8; font-size: 1.25rem; cursor: pointer;">🔍</span>
      </div>
    </div>
    
    <div class="header-meta">
      <div class="date-badge">📅 12/11/26</div>
      <img src="https://raw.githubusercontent.com/htochko/htochko.github.io/refs/heads/master/pics/stock/investor_solomon.png" alt="Organizer" class="avatar-img">
    </div>
  </header>

  <main class="main-content">
    <div id="challengerGrid" class="ag-theme-alpine-dark"></div>
  </main>

  <!-- Sticky Button Bar -->
  <div id="stickyBar" class="sticky-action-bar hidden">
    <span id="selectedCountText" style="font-size: 0.9rem; color: #f8fafc;">0 creators selected</span>
    <button id="openRequestModalBtn" class="btn-primary">Send Bounty Request 🚀</button>
  </div>

  <!-- Modal Request Form -->
  <div id="requestModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 class="modal-title">Create Bounty Request</h3>
      
      <div class="form-group">
        <label class="form-label">Recipients (Selected Handles)</label>
        <div id="handlesContainer" style="min-height: 36px; padding: 0.2rem; background: #1e293b; border-radius: 6px;"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Budget ($ USD)</label>
        <input type="number" id="bountyBudget" class="form-input" placeholder="e.g. 150" min="1" />
      </div>

      <div class="form-group">
        <label class="form-label">Task Description & Requirements</label>
        <textarea id="bountyTask" class="form-textarea" rows="4" placeholder="Describe the map requirements, dataset parameters, or desired style..."></textarea>
      </div>

      <div class="modal-actions">
        <button id="closeModalBtn" class="btn-secondary">Cancel</button>
        <button id="submitBountyBtn" class="btn-primary">Confirm & Send Request</button>
      </div>
    </div>
  </div>

  <!-- Modal Form Submitted-->
  <div id="submitModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 class="modal-title">Your request submitted</h3>
      
      <div class="form-group">
        Check payment status on account dashboard <a href="#">
          <img alt="File:PayPal.svg" src="https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b5/PayPal.svg/250px-PayPal.svg.png?utm_source=commons.wikimedia.org&amp;utm_campaign=index&amp;utm_content=thumbnail&amp;_=20241230110020" decoding="async" loading="lazy" width="124" height="33" data-file-width="124" data-file-height="33">
        </a>
      </div>
      <div class="form-group">
        Check issue status on @htochko board <a href="https://github.com/htochko/30-day-map-challenge/issues/1">#1</a>
      </div>
      <div class="form-group">
        Check issue status on @1719hd board <a href="https://github.com/htochko/30-day-map-challenge/issues/1">#1</a>
      </div>
      <div class="modal-actions">
        <button id="closeSubmitModalBtn" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

</body>
</html>
